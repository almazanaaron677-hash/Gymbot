function buscarEjercicio() {

  const entradaBusqueda =
    document.getElementById("buscador");

  if (!entradaBusqueda) {
    return;
  }

  const texto =
    normalizar(entradaBusqueda.value);

  const tarjetas =
    document.querySelectorAll(".ejercicio-card");

  tarjetas.forEach(function(tarjeta) {

    const contenido =
      normalizar(tarjeta.textContent);

    if (
      texto === "" ||
      contenido.includes(texto)
    ) {

      tarjeta.style.display = "block";

    } else {

      tarjeta.style.display = "none";

    }

  });

}


function limpiarChat() {

  const chat =
    document.getElementById("chat");

  chat.innerHTML = `

    <div class="mensaje bot">

      <div class="avatar">
        🤖
      </div>

      <div class="burbuja">

        ¡Listo! 🧹
        La conversación fue limpiada.

        <br><br>

        ¿Qué quieres preguntarme ahora?

      </div>

    </div>

  `;

}


function mensajeBienvenida() {

  const hora =
    new Date().getHours();

  let saludo = "Hola";

  if (hora >= 5 && hora < 12) {

    saludo = "Buenos días";

  }

  else if (hora >= 12 && hora < 19) {

    saludo = "Buenas tardes";

  }

  else {

    saludo = "Buenas noches";

  }

  return `
    ${saludo} 👋
    Soy <b>GymBot</b>.
    ¿Qué te gustaría aprender?
  `;

}

function guardarModo() {

  const oscuro =
    document.body.classList.contains("oscuro");

  try {

    localStorage.setItem(
      "gymbotModo",
      oscuro ? "oscuro" : "claro"
    );

  } catch (error) {

    console.log(
      "No se pudo guardar el modo."
    );

  }

}


function cargarModo() {

  try {

    const modo =
      localStorage.getItem("gymbotModo");

    if (modo === "oscuro") {

      document.body.classList.add("oscuro");

    }

  } catch (error) {

    console.log(
      "No se pudo cargar el modo."
    );

  }

}


function cambiarModo() {

  document
    .body
    .classList
    .toggle("oscuro");

  guardarModo();

}


function prepararPagina() {

  cargarModo();

  actualizarTiempo();

}
