<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GYMBOT - Asistente de Gimnasio</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <div class="contenedor">

        <header class="encabezado">
            <h1>💪 GYMBOT</h1>
            <p>Tu asistente virtual de gimnasio</p>
        </header>

        <main id="chat" class="chat">
        </main>

        <div class="botones">
            <button onclick="entrada.value='Ejercicios para pecho'; enviarMensaje()">
                💪 Pecho
            </button>

            <button onclick="entrada.value='Ejercicios para espalda'; enviarMensaje()">
                🏋️ Espalda
            </button>

            <button onclick="entrada.value='Ejercicios para piernas'; enviarMensaje()">
                🦵 Piernas
            </button>

            <button onclick="entrada.value='Ejercicios para hombros'; enviarMensaje()">
                🔥 Hombros
            </button>

            <button onclick="entrada.value='calentamiento'; enviarMensaje()">
                🔥 Calentamiento
            </button>

            <button onclick="entrada.value='cardio'; enviarMensaje()">
                🏃 Cardio
            </button>
        </div>

        <div class="entrada">

            <input
                type="text"
                id="entrada"
                placeholder="Escribe tu pregunta..."
                autocomplete="off"
            >

            <button onclick="enviarMensaje()">
    ➤
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
